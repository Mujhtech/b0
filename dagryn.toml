# -----------------------------------------------------------------------------
# Tasks generated from existing GitHub Actions workflows
# You can tweak commands / dependencies to better fit Dagryn.
# -----------------------------------------------------------------------------

[workflow]
name = "default"
default = true

[plugins]
setup-node = "official:setup-node@v0.2.1"
setup-pnpm = "official:setup-pnpm@v0.2.1"
setup-go = "official:setup-go@v0.2.1"
golangci-lint = "github:golangci/golangci-lint@v2.8.0"
golang-vul = "go:golang.org/x/vuln/cmd/govulncheck@latest"

[tasks.frontend-install]
workdir = "frontend"
command = "pnpm install --frozen-lockfile"
uses = ["setup-node", "setup-pnpm"]
inputs = ["package.json", "pnpm-lock.yaml"]
outputs = ["node_modules/**"]
timeout = "5m"

[tasks.frontend-typecheck]
workdir = "frontend"
command = "pnpm run typecheck"
uses = ["setup-node", "setup-pnpm"]
needs = ["frontend-install"]
inputs = ["src/**", ".eslintrc*", "eslint.config.*", "package.json"]
timeout = "5m"

[tasks.frontend-test]
workdir = "frontend"
command = "pnpm run test:run"
uses = ["setup-node", "setup-pnpm"]
needs = ["frontend-install"]
inputs = ["src/**", "test/**", "tests/**", "__tests__/**", "package.json"]
timeout = "5m"


[tasks.backend-install]
workdir = "backend"
uses = ["setup-go"]
command = "go mod download && go mod verify"
inputs = ["go.mod", "go.sum"]
timeout = "5m"


[tasks.backend-build]
workdir = "backend"
uses = ["setup-go"]
command = "go build -o b0 ./cmd"
needs = ["backend-install"]
inputs = ["go.mod", "go.sum", "**/*.go"]
timeout = "10m"
outputs = ["bin/**"]


[tasks.backend-vet-and-lint]
workdir = "backend"
uses = ["setup-go", "golangci-lint"]
command = "go vet ./... && golangci-lint run ./..."
needs = ["backend-install", "backend-build"]
inputs = ["**/*.go", ".golangci.yml", ".golangci.yaml"]
timeout = "10m"


[tasks.backend-test]
workdir = "backend"
uses = ["setup-go"]
command = "go test -v -race -coverprofile=coverage.out ./..."
needs = ["backend-install", "backend-build"]
inputs = ["**/*.go", "go.mod", "go.sum"]
outputs = ["coverage.out"]
timeout = "10m"


[tasks.backend-vulnerability-scan]
command = "govulncheck -C ./... -json > gosec-report.json"
uses = ["setup-go", "golang-vul"]
needs = ["backend-install", "backend-build"]
inputs = ["**/*.go", "go.mod", "go.sum"]
outputs = ["gosec-report.json"]
timeout = "5m"

[workflow.trigger]
[workflow.trigger.push]
branches = ["main"]
